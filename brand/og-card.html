<!doctype html>
<!--
  A weboldal megosztási képének (site/og-image.png, 1200×630) forrása.
  Újragenerálás Windowson (Edge fejnélküli módban), a repó gyökeréből:
    "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" --headless --disable-gpu --hide-scrollbars
      --window-size=1200,630 --screenshot="%CD%\site\og-image.png" "%CD%\brand\og-card.html"
-->
<html lang="hu">
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    color: #fff;
    background: radial-gradient(1000px 600px at 85% 15%, #14b8a6 0%, rgba(20, 184, 166, 0) 60%),
      linear-gradient(135deg, #0c1a1a 0%, #0f3f3a 55%, #0f5f58 100%);
    display: flex;
    align-items: center;
  }
  .card { display: flex; gap: 56px; align-items: center; padding: 0 84px; }
  .logo { width: 220px; height: 220px; flex: none; filter: drop-shadow(0 18px 40px rgba(0, 0, 0, 0.35)); }
  .eyebrow { font-size: 26px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5eead4; }
  h1 { margin: 10px 0 0; font-size: 86px; line-height: 1; font-weight: 750; letter-spacing: -0.02em; }
  .lead { margin-top: 22px; font-size: 34px; line-height: 1.3; color: #d5f5ef; max-width: 760px; }
  .chips { display: flex; gap: 14px; margin-top: 34px; flex-wrap: wrap; }
  .chip { font-size: 24px; font-weight: 600; padding: 10px 20px; border-radius: 999px; background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.22); }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="../site/logo.svg" alt="" />
    <div>
      <div class="eyebrow">Kriptó adó kalkulátor</div>
      <h1>Kriptomérleg</h1>
      <div class="lead">15% SZJA MNB árfolyamon, tőzsdei import és NAV-bevallási segéd. Helyben fut, fiók nélkül.</div>
      <div class="chips">
        <span class="chip">Ingyenes</span>
        <span class="chip">Windows · Linux · NixOS</span>
        <span class="chip">Szja tv. 67/C. §</span>
      </div>
    </div>
  </div>
</body>
</html>
