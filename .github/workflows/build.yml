name: Build & Release (Windows + Linux)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            artifact: kriptomerleg-windows
          - os: ubuntu-22.04
            bundles: deb,appimage
            artifact: kriptomerleg-linux
    runs-on: ${{ matrix.os }}
    # Az aláíró kulcs a „release” környezet titka, amelyet csak a main ág használhat. Tag- és
    # PR-buildnél nincs környezet és kulcs (ezek a kiadások nem frissíthetők automatikusan).
    environment: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && 'release' || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux függőségek
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Kiadási verzió: tagnél a tag (v1.2.3 → 1.2.3), egyébként a package.json fő.al verziója
      # + a futás sorszáma (pl. 0.3.12). Ez kerül az appba is, így a frissítő mindig nagyobb verziót lát.
      - name: Verzió
        id: ver
        shell: bash
        run: |
          BASE=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="${BASE%.*}.${GITHUB_RUN_NUMBER}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Verzió: $V"

      - name: Felület-tesztek (Vitest)
        run: npm test

      - name: Rust tesztek
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Ha a TAURI_SIGNING_PRIVATE_KEY titok be van állítva, a frissítő (updater) aláírt
      # csomagjai is elkészülnek; nélküle a build ugyanúgy lefut, csak automatikus frissítés nélkül.
      - name: Tauri build
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npm run tauri build -- --bundles ${{ matrix.bundles }} --config "{\"version\":\"$VERSION\",\"bundle\":{\"createUpdaterArtifacts\":true}}"
          else
            echo "::notice::Nincs TAURI_SIGNING_PRIVATE_KEY titok: automatikus frissítés nélküli build."
            npm run tauri build -- --bundles ${{ matrix.bundles }} --config "{\"version\":\"$VERSION\"}"
          fi

      # Egységes, ékezet és verziószám nélküli fájlnevek: így a
      # releases/latest/download/<fájl> link mindig a legújabbra mutat (landing oldal).
      - name: Kimenetek összegyűjtése
        shell: bash
        run: |
          mkdir -p out
          B=src-tauri/target/release/bundle
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "$B"/nsis/*-setup.exe "out/kriptomerleg_windows_x64-setup.exe"
            cp src-tauri/target/release/kriptomerleg.exe "out/kriptomerleg_windows_x64-portable.exe"
            for s in "$B"/nsis/*-setup.exe.sig; do [ -f "$s" ] && cp "$s" "out/kriptomerleg_windows_x64-setup.exe.sig"; done
          else
            cp "$B"/deb/*.deb "out/kriptomerleg_linux_amd64.deb"
            cp "$B"/appimage/*.AppImage "out/kriptomerleg_linux_amd64.AppImage"
            for s in "$B"/appimage/*.AppImage.sig; do [ -f "$s" ] && cp "$s" "out/kriptomerleg_linux_amd64.AppImage.sig"; done
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*
          if-no-files-found: error

  # Ismert sérülékenységek a függőségekben (RustSec adatbázis, npm advisory).
  # Kivételek indoklással: src-tauri/.cargo/audit.toml.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit
      - name: npm audit (futásidejű függőségek)
        run: npm audit --omit=dev --audit-level=moderate

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: nix build (NixOS csomag)
        run: nix build .#default -L
      - name: Bináris ellenőrzése
        run: test -x result/bin/kriptomerleg
      # A GTK fájlválasztó (CSV-export, import) séma nélkül összeomlik (#1).
      - name: GTK fájlválasztó séma a csomagban
        run: |
          for d in $(grep -ao '/nix/store/[^:"'"'"' ]*gsettings-schemas/[^:"'"'"' ]*' result/bin/kriptomerleg | sort -u); do
            ls "$d/glib-2.0/schemas" 2>/dev/null
          done | grep -q org.gtk.Settings.FileChooser
      - name: GTK fájlválasztó séma a fejlesztői környezetben
        run: |
          nix develop -c sh -c 'for d in $(echo "$XDG_DATA_DIRS" | tr : " "); do ls "$d/glib-2.0/schemas" 2>/dev/null; done' \
            | grep -q org.gtk.Settings.FileChooser

  release:
    # Minden main-re pusholt változásból és minden v* tagből új release készül.
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Kiadási verzió: tagnél a tag (v1.2.3 → 1.2.3), egyébként a package.json fő.al verziója
      # + a futás sorszáma (pl. 0.3.12). Ez kerül az appba is, így a frissítő mindig nagyobb verziót lát.
      - name: Verzió
        id: ver
        shell: bash
        run: |
          BASE=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="${BASE%.*}.${GITHUB_RUN_NUMBER}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Verzió: $V"

      - name: Tag és kiadási jegyzet
        id: v
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          TAG="v${VERSION}"
          NAME="Kriptomérleg ${VERSION}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          {
            echo "## Letöltés"
            echo
            echo "- **Windows:** \`*_windows_x64-setup.exe\` (telepítő) vagy \`*_windows_x64-portable.exe\` (telepítés nélkül)"
            echo "- **Linux (Debian/Ubuntu):** \`*_linux_amd64.deb\` → \`sudo apt install ./kriptomerleg_*.deb\`"
            echo "- **Linux (bármely):** \`*_linux_amd64.AppImage\` → \`chmod +x\`, majd futtatás"
            echo "- **NixOS:** \`nix run git+ssh://git@github.com/${GITHUB_REPOSITORY}\`"
            echo
            echo "## Változás"
            echo
            git log -1 --pretty=format:'%s%n%n%b' "$GITHUB_SHA" | grep -v '^Co-Authored-By:'
          } > notes.md

      # Az automatikus frissítő ebből a fájlból tudja meg az új verziót (csak aláírt build esetén).
      - name: latest.json (frissítő)
        shell: bash
        env:
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if ! ls dist/*.sig >/dev/null 2>&1; then
            echo "Nincs aláírt csomag, latest.json nem készül."
            exit 0
          fi
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          node -e '
            const fs = require("fs");
            const [version, base] = process.argv.slice(1);
            const sig = (f) => fs.existsSync(`dist/${f}.sig`) ? fs.readFileSync(`dist/${f}.sig`, "utf8").trim() : null;
            const platforms = {};
            const win = sig("kriptomerleg_windows_x64-setup.exe");
            if (win) platforms["windows-x86_64"] = { signature: win, url: `${base}/kriptomerleg_windows_x64-setup.exe` };
            const lin = sig("kriptomerleg_linux_amd64.AppImage");
            if (lin) platforms["linux-x86_64"] = { signature: lin, url: `${base}/kriptomerleg_linux_amd64.AppImage` };
            const notes = fs.readFileSync("notes.md", "utf8").split("## Változás")[1]?.trim() ?? "";
            fs.writeFileSync("dist/latest.json", JSON.stringify({ version, notes, pub_date: new Date().toISOString(), platforms }, null, 2));
          ' "$VERSION" "$BASE"
          cat dist/latest.json

      # A release-ek változtathatatlanok (Release immutability): közzététel után fájl nem
      # tölthető fel. Ezért előbb piszkozat készül az összes fájllal, és csak utána tesszük közzé.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: ${{ steps.v.outputs.name }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          draft: true
          files: dist/*
          fail_on_unmatched_files: true

      - name: Közzététel
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
