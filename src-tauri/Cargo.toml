[package]
name = "kriptomerleg"
version = "0.3.0"
description = "Kriptomérleg – magyar kriptó-SZJA kalkulátor, helyben futó asztali app"
authors = ["you"]
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kriptomerleg_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = "2.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
calamine = "0.37"
csv = "1"
rust_xlsxwriter = "0.102"
argon2 = "0.5"
chacha20poly1305 = "0.10"
tauri-plugin-notification = "2"
printpdf = "0.7"
ttf-parser = "0.19"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"

# A GTK fájlválasztó sémájának ellenőrzéséhez (a tauri gtk-rs verziójával egyezően).
[target.'cfg(target_os = "linux")'.dependencies]
gio = "0.18"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2.4.0"
tauri-plugin-updater = "2.14.1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
